name: shekharboard
description: "শেখার বোর্ড - Bangla Educational App for Children Ages 1-5"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # UI & Responsive
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  
  # Navigation
  go_router: ^14.2.0
  
  # State Management
  provider: ^6.1.2
  
  # Local Storage
  shared_preferences: ^2.3.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Audio
  audioplayers: ^6.1.0
  
  # Localization
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  
  # Utils
  path_provider: ^2.1.5
  equatable: ^2.0.5
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true  # Enable code generation for localization
  uses-material-design: true

  # Assets
  assets:
    - assets/audio/bn/
    - assets/audio/bn/animals/
    - assets/audio/bn/fruits/
    - assets/audio/bn/vehicles/
    - assets/audio/bn/numbers/
    - assets/audio/bn/colors/
    - assets/audio/bn/alphabet/
    - assets/audio/bn/alphabet/vowels/
    - assets/audio/bn/feedback/
    - assets/audio/bn/rhymes/
    - assets/audio/bn/stories/
    - assets/audio/bn-female/
    - assets/audio/bn-female/animals/
    - assets/audio/bn-female/fruits/
    - assets/audio/bn-female/vehicles/
    - assets/audio/bn-female/numbers/
    - assets/audio/bn-female/colors/
    - assets/audio/bn-female/alphabet/
    - assets/audio/bn-female/feedback/
    - assets/audio/bn-female/rhymes/
    - assets/audio/bn-female/stories/
    - assets/audio/bn-anime/
    - assets/audio/bn-anime/animals/
    - assets/audio/bn-anime/fruits/
    - assets/audio/bn-anime/vehicles/
    - assets/audio/bn-anime/numbers/
    - assets/audio/bn-anime/colors/
    - assets/audio/bn-anime/alphabet/
    - assets/audio/bn-anime/feedback/
    - assets/audio/bn-anime/rhymes/
    - assets/audio/bn-anime/stories/
    - assets/images/
    
  # Fonts - Bangla support
  # fonts:
  #   - family: HindSiliguri
  #     fonts:
  #       - asset: assets/fonts/HindSiliguri-Regular.ttf
  #       - asset: assets/fonts/HindSiliguri-Bold.ttf
  #         weight: 700
